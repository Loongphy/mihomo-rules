proxy-groups:
  - name: 🚀 默认
    type: select
    proxies: [💸 低倍率自动, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇺🇸 美国自动, 🇺🇸 美国, 🇭🇰 香港, 🇯🇵 日本, 🇨🇳 台湾, 🇸🇬 新加坡, 🌐 全部, DIRECT]

  - name: 💬 OpenAI
    type: select
    proxies: [🇺🇸 美国, 🇯🇵 日本, 🇸🇬 新加坡, 🌐 全部]

  - name: Ⓜ️ Microsoft
    type: select
    proxies: [🇺🇸 美国自动, DIRECT, 🚀 默认, 🇭🇰 香港, 🇯🇵 日本, 🇨🇳 台湾, 🇸🇬 新加坡, 🇺🇸 美国, 🌐 全部]

  - name: 🍎 Apple
    type: select
    proxies: [DIRECT, 🚀 默认, 🇺🇸 美国自动, 🇭🇰 香港, 🇯🇵 日本, 🇨🇳 台湾, 🇸🇬 新加坡, 🇺🇸 美国, 🌐 全部]

  - name: 🔍 Google
    type: select
    proxies: [🇺🇸 美国自动, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动,  🇺🇸 美国, 💬 OpenAI]

  - name: 📹 YouTube
    type: select
    proxies: [🚀 默认, 🇭🇰 香港, 🇯🇵 日本, 🇨🇳 台湾, 🇸🇬 新加坡, 🇺🇸 美国, 🇺🇸 美国自动, 🌐 全部]

  - name: 🎭 Mask
    type: select
    include-all: true

  - name: 📲 Telegram
    type: select
    proxies: [🚀 默认, 🇭🇰 香港, 🇯🇵 日本, 🇨🇳 台湾, 🇸🇬 新加坡, 🇺🇸 美国, 🌐 全部]

  - name: 🐦 X
    type: select
    proxies: [🚀 默认, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇸🇬 新加坡自动, 🇭🇰 香港, 🇯🇵 日本, 🇨🇳 台湾, 🇸🇬 新加坡, 🇺🇸 美国, 🌐 全部]

  - name: 📘 Facebook
    type: select
    proxies: [🚀 默认, 🇭🇰 香港, 🇯🇵 日本, 🇨🇳 台湾, 🇸🇬 新加坡, 🇺🇸 美国, 🌐 全部]

  - name: 📷 Instagram
    type: select
    proxies: [🚀 默认, 🇭🇰 香港, 🇯🇵 日本, 🇨🇳 台湾, 🇸🇬 新加坡, 🇺🇸 美国, 🌐 全部]

  - name: 💰 PayPal
    type: select
    proxies: [DIRECT, 🚀 默认, 🇭🇰 香港, 🇯🇵 日本, 🇨🇳 台湾, 🇸🇬 新加坡, 🇺🇸 美国, 🌐 全部]

  - name: 💸 低倍率自动
    type: url-test
    include-all: true
    tolerance: 100
    interval: 100
    filter: "(?i)(?=.*?(0\\.\\d+\\s*(x|倍)|x\\s*0\\.\\d+)).*$"
    exclude-filter: "(?=.*?(下载|送中|中转)).*$"

  - name: 🇭🇰 香港
    type: select
    include-all: true
    filter: "(?=.*?(香港|港|HK|Hong Kong|Hongkong|HKSAR)).*$"

  - name: 🇭🇰 香港自动
    type: url-test
    include-all: true
    tolerance: 100
    interval: 300
    filter: "(?=.*?(香港|港|HK|Hong Kong|Hongkong|HKSAR)).*$"
    exclude-filter: "(?=.*?(下载|链式|中转|美国)).*$"

  - name: 🇺🇸 美国
    type: select
    include-all: true
    filter: "(?=.*?(美国|美|美利坚|US|USA|(?i)States|(?i)America)).*$"

  - name: 🇺🇸 美国自动
    type: url-test
    include-all: true
    tolerance: 200
    interval: 300
    filter: "(?=.*?(美国|美|美利坚|US|USA|(?i)States|(?i)America)).*$"
    exclude-filter: "(?=.*?(下载|链式|中转|送中)).*$"

  - name: 🇯🇵 日本
    type: select
    include-all: true
    filter: "(?=.*?(日本|日(?!利亚)|Japan|Nippon|JP|Japanese)).*$"

  - name: 🇯🇵 日本自动
    type: url-test
    include-all: true
    tolerance: 100
    interval: 300
    filter: "(?=.*?(日本|日(?!利亚)|Japan|Nippon|JP|Japanese)).*$"
    exclude-filter: "(?=.*?(下载|链式|中转|送中)).*$"

  - name: 🇸🇬 新加坡
    type: select
    include-all: true
    filter: "(?=.*?(新加坡|新|Singapore|SG|Singapura)).*$"

  - name: 🇸🇬 新加坡自动
    type: url-test
    include-all: true
    tolerance: 200
    interval: 300
    filter: "(?=.*?(新加坡|新|Singapore|SG|Singapura)).*$"
    exclude-filter: "(?=.*?(下载|链式|中转|送中)).*$"

  - name: 🇨🇳 台湾
    type: select
    include-all: true
    filter: "(?=.*?(台湾|台|Taiwan|TW|Chinese Taipei)).*$"

  - name: 🇮🇳 印度
    type: select
    include-all: true
    filter: "(?=.*?(印度|India|Mumbai|Bombay|孟买|Delhi|New Delhi|德里|Bangalore|Bengaluru|班加罗尔|Chennai|Madras|金奈|Hyderabad|海得拉巴|Kolkata|Calcutta|加尔各答|Pune|浦那|Ahmedabad|艾哈迈达巴德|IN-)).*$"

  - name: ⏬ 下载
    type: fallback
    include-all: true
    tolerance: 350
    interval: 100
    url: https://api2.cursor.sh
    filter: "(?=.*?(下载)).*$"

  - name: 🌐 全部
    type: select
    include-all: true
    exclude-filter: "(?=.*?(流量|剩余|期|company-network|备用)).*$"

