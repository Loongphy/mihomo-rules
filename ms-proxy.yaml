# ============================================================
# 微软"需走代理"规则集（mihomo rule-provider, classical）
# 依据：抓取 www.bing.com / m365.cloud.microsoft 实际页面调用域名
#       + v2fly domain-list-community (geosite:bing/microsoft 源数据)
#       + 微软官方 endpoints.office.com 端点 JSON
# 原则：凡参与"同账号登录态 / IP 区域判定 / 业务 API"的域全部代理，
#       静态 CDN/下载域不放进此集（归 GEOSITE,microsoft 直连兜底）。
# ============================================================
payload:
  # ================= Bing 搜索 + Rewards 业务域 =================
  - DOMAIN-SUFFIX,bing.com            # www/cn/rewards/platform/business/bj1.api/appex/bat 全子域
  - DOMAIN-SUFFIX,bing.com.cn         # cn 版入口
  - DOMAIN-SUFFIX,bing.net            # r/th/mm/tse1 图片与静态 CDN（与搜索同业务链）
  - DOMAIN-SUFFIX,bingapis.com        # 后端 API
  - DOMAIN-SUFFIX,bingapistatistics.com
  - DOMAIN-SUFFIX,bingstatic.com      # 页面静态资源
  - DOMAIN-SUFFIX,bingvisualsearch.com# 以图搜图
  - DOMAIN-SUFFIX,bingsandbox.com
  - DOMAIN-SUFFIX,bing123.com
  - DOMAIN-SUFFIX,dictate.ms          # 听写服务
  - DOMAIN-SUFFIX,engkoo.com          # 必应词典
  - DOMAIN-SUFFIX,microsoftapp.net    # bing.microsoftapp.net 等（bing.html 实测）
  # Copilot（与 bing 同业务链，Rewards 页面常出现）
  - DOMAIN-SUFFIX,copilot.microsoft.com
  - DOMAIN-SUFFIX,copilot.com

  # ================= MSA / AAD 登录态链 =================
  # 注意：不能写 live.com 后缀——storage.live.com 是下载域（直连可用）；
  #      onedrive.live.com 被墙，已在下方单独代理
  - DOMAIN,login.live.com             # MSA 登录核心
  - DOMAIN,account.live.com
  - DOMAIN,signup.live.com
  - DOMAIN-SUFFIX,hip.live.com        # 人机验证（HIP challenge）
  - DOMAIN-SUFFIX,microsoftonline.com # login./device./ccs./loginex./passwordreset. 全认证子域
  - DOMAIN,account.microsoft.com      # Rewards 账户页
  - DOMAIN-SUFFIX,msauth.net          # AAD 认证辅助
  - DOMAIN-SUFFIX,msftauth.net
  - DOMAIN-SUFFIX,msauthimages.net
  - DOMAIN-SUFFIX,msftauthimages.net
  - DOMAIN-SUFFIX,msftidentity.com
  - DOMAIN-SUFFIX,passport.net        # 旧版 MSA

  # ================= OneDrive 网页端 =================
  # 实测（Sparkle 日志 + 本机 DNS）：onedrive.live.com 在大陆被 DNS 投毒
  # （解析到 108.160.167.x / 199.96.61.x 等假 IP），DIRECT 连接超时，
  # 网页外壳必须走代理；登录链（login.live.com）与个人内容 API
  # （my.microsoftpersonalcontent.com）上下两处已覆盖。
  # 注意：storage.live.com / api.onedrive.com / *.files.1drv.com / 1drv.ms
  # 实测直连可达（OneDrive.exe 同步依赖），继续归 GEOSITE,microsoft 直连。
  - DOMAIN-SUFFIX,onedrive.live.com   # 个人版网页外壳（被墙）

  # ================= m365.cloud.microsoft 门户 =================
  # 实测 m365 页会拉取 copilot/outlook/word/excel/powerpoint.cloud.microsoft
  # 及 teams/admin 等兄弟子域——只代理 m365 一个主机名会在门户内跳转时破链，
  # 故推荐代理整个 cloud.microsoft 家族；若严格只要 m365 门户本体，
  # 可只保留下一行、注释掉 cloud.microsoft。
  - DOMAIN-SUFFIX,m365.cloud.microsoft
  - DOMAIN-SUFFIX,cloud.microsoft     # 门户家族（推荐）
  - DOMAIN-SUFFIX,office.com          # portal/outlook/substrate/www/support
  - DOMAIN-SUFFIX,office365.com       # outlook.office365.com 等
  - DOMAIN-SUFFIX,microsoft365.com    # 入口页
  - DOMAIN-SUFFIX,officeapps.live.com # ocws.officeapps 等 Office 在线应用
  - DOMAIN,graph.microsoft.com        # 门户数据 API（DOMAIN 精确匹配）
  - DOMAIN,substrate.office.com       # 门户后端 API（office.com 后缀已含，冗余保险）
  # ---- 实测 m365 页面拉取的业务域（日志/HTML/官方端点） ----
  - DOMAIN-SUFFIX,microsoftpersonalcontent.com # OneDrive/Office 个人内容服务
  - DOMAIN-SUFFIX,teams.microsoft.com   # Teams 网页版
  - DOMAIN-SUFFIX,microsoftteams.com
  - DOMAIN-SUFFIX,trouter.skype.com     # Teams/Skype 实时消息通道（网页版会调）
  - DOMAIN-SUFFIX,onenote.com           # OneNote 网页版
  - DOMAIN-SUFFIX,sway.com              # Sway
  - DOMAIN-SUFFIX,sway-cdn.com
  - DOMAIN-SUFFIX,yammer.com            # Viva Engage
  - DOMAIN-SUFFIX,yammerusercontent.com
  - DOMAIN-SUFFIX,microsoftstream.com   # Stream 视频
  - DOMAIN,whiteboard.microsoft.com     # Whiteboard
  - DOMAIN-SUFFIX,outlook.com           # 个人邮箱网页（bing 页面也引用）
  - DOMAIN,outlook.live.com             # 邮箱 API 在 live.com 子域
  - DOMAIN-SUFFIX,powerbi.com           # Power Platform（官方 M365 端点收录）
  - DOMAIN-SUFFIX,powerapps.com
  - DOMAIN-SUFFIX,powerautomate.com
  - DOMAIN,autologon.microsoftazuread-sso.com  # 企业 SSO 自动登录
  # 可选：门户外壳静态资源（直连也能用，只是区域判定更一致）
  # - DOMAIN,res.cdn.office.net
  # - DOMAIN,shell.cdn.office.net
  # - DOMAIN,uhf.microsoft.com
  # - DOMAIN,wcpstatic.microsoft.com

# ============ 故意不放进来（走直连/兜底）的域 ============
# 遥测/广告：clarity.ms、bat.bing.com(已在 bing.com)、browser.events.data.msn.com、
#   browser.pipe.aria.microsoft.com、arc.msn.com、bingads.com、microsoftads.com、
#   msads.net、nelreports.net、applicationinsights.io/net、aria.ms、
#   data.microsoft.com、telemetry.microsoft.com
#   ——纯埋点，IP 不一致不影响功能，直连省流量。
# 静态/营销：www.microsoft.com、learn./support./partner.microsoft.com、
#   assets.msn.com、www.msn.com、aka.ms、go.microsoft.com
# OneDrive 下载/同步（直连可用）：storage.live.com、api.onedrive.com、
#   *.files.1drv.com、1drv.ms、onedriveclucprod*.blob.core.windows.net
# Edge 服务配置（直连可隐藏 Copilot 图标）：edge.microsoft.com、
#   config.edge.skype.com、api.cdp.microsoft.com —— 见 README「Edge Copilot 图标显隐」
# 下载/更新/CDN：由 GEOSITE,microsoft 兜底直连。
# ============================================================
